<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mario Maker</title>
  <link rel="stylesheet" type="text/css" href="css/style.css?v=27">
  <link rel="stylesheet" type="text/css" href="css/reset.css">
</head>

<body>

  <!-- main game -->
  <div class="main-wrapper">
    <canvas class="game-screen" aria-label="Mario mini-game play area"></canvas>
    <nav class="mobile-controls" aria-label="Game controls">
      <div class="mobile-control-group mobile-directions">
        <button type="button" class="mobile-control" data-key-code="37" aria-label="Move left">&#8592;</button>
        <button type="button" class="mobile-control" data-key-code="39" aria-label="Move right">&#8594;</button>
      </div>
      <div class="mobile-control-group mobile-actions">
        <button type="button" class="mobile-control mobile-control-run" data-key-code="16">Run</button>
        <button type="button" class="mobile-control mobile-control-fire" data-key-code="17">Fire</button>
        <button type="button" class="mobile-control mobile-control-jump" data-key-code="32">Jump</button>
      </div>
    </nav>
  </div>

  <script src="js/View.js"></script>
  <script src="js/GameUI.js?v=16"></script>

  <script src="js/mainGame/GameSound.js?v=21"></script>
  <script src="js/mainGame/Element.js"></script>
  <script src="js/mainGame/PowerUp.js?v=11"></script>
  <script src="js/mainGame/Enemy.js"></script>
  <script src="js/mainGame/Bullet.js"></script>
  <script src="js/mainGame/Mario.js?v=25"></script>
  <script src="js/mainGame/MiniGame.js?v=15"></script>
  <script src="js/mainGame/Score.js?v=21"></script>
  <script src="js/mainGame/MarioGame.js?v=25"></script>

  <script src="js/MarioMaker.js?v=27"></script>

  <script src="js/Preloader.js?v=27"></script>

</body>

</html>
